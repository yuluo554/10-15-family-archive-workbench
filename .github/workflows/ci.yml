name: CI

on:
  push:
    branches: [main]
  pull_request:

# 编码加固：Windows 管道 cp1252 会崩在中文 print（首跑环境差异头号签名）
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          # 历史扫描类守门测试依赖全量历史，浅克隆会静默空验
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: CLI smoke（源码/editable 态）
        run: |
          famarchive --version
          famarchive profile show
      - name: Tests（源码态；packaging 守门由专门 job 跑）
        run: python -m pytest -v -m "not packaging"

  packaging:
    # 非 editable 安装守门（D1 回归防线）：构建 wheel → 全新 venv → 装 → CLI 冒烟。
    # 必须在「中立目录 + 全新 venv + 装 wheel」下做，editable 会假绿（本仓核心教训）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: python -m pip install -e .[dev]
      - name: Non-editable install gate
        run: python -m pytest -v -m packaging