name: CI

on:
  push:
    branches: [main]
  pull_request:

# 编码加固：Windows 管道 cp1252 会崩在中文 print（首跑环境差异头号签名）
env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # 历史扫描类守门测试依赖全量历史，浅克隆会静默空验
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .[dev]
      - name: CLI smoke
        run: |
          famarchive --version
          famarchive profile show
      - name: Tests
        run: python -m pytest -v
